<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Footy Tracker</title>
<meta name="description" content="Water, food, sleep, training and fitness tracker for a young footballer. Everything stays on this device.">
<meta name="theme-color" content="#1b7a3a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Footy">
<link rel="manifest" id="manifestLink">
<link rel="apple-touch-icon" id="appleIcon">
<link rel="icon" id="favIcon">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --pitch:#1b7a3a;--pitch-d:#0f5a29;--pitch-l:#e6f4e9;--stripe:#208443;
  --bg:#f2f6f2;--card:#ffffff;--ink:#14231a;--muted:#5b6d60;--line:#dbe5dd;
  --water:#2d8cf0;--water-l:#e3f0ff;--gold:#f5b400;--red:#e5484d;--orange:#f08c00;--purple:#7048e8;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.06);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0d1510;--card:#16211a;--ink:#e7f0e9;--muted:#9bb0a1;--line:#27362c;--pitch-l:#173222;--water-l:#132a40;
    --shadow:0 1px 2px rgba(0,0,0,.4)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.4;
  display:flex;flex-direction:column;height:100vh;height:100dvh;touch-action:manipulation;-webkit-text-size-adjust:100%}
header.top{flex:none;position:relative;z-index:20;color:#fff;
  background:repeating-linear-gradient(90deg,var(--pitch) 0 44px,var(--stripe) 44px 88px);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header.top .row{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
header.top h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.2px;flex:1}
header.top .date{font-size:13px;opacity:.9}
main{flex:1;min-height:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  padding:14px max(16px, calc(50% - 304px)) 24px}
h2{font-size:18px;margin:0 0 10px}
h3{font-size:16px;margin:14px 0 8px}
p{margin:6px 0}
a{color:inherit;font-weight:700}
.muted{color:var(--muted)}.small{font-size:13px}.center{text-align:center}
.card{background:var(--card);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card.pitch{background:linear-gradient(135deg,var(--pitch),var(--pitch-d));color:#fff;border:none}
.card.pitch .muted{color:#d6eedc}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}.grow{flex:1}.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
button,.btn{font:inherit;border:none;cursor:pointer;border-radius:14px;min-height:46px;padding:10px 16px;font-weight:700;
  background:var(--pitch-l);color:var(--pitch-d);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
@media (prefers-color-scheme:dark){button,.btn{color:#8fe0a6}}
button:active{transform:scale(.97)}
.btn.primary{background:var(--pitch);color:#fff}
.btn.water{background:var(--water);color:#fff}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--red);color:#fff}
.btn.block{width:100%}
.btn.big{min-height:64px;font-size:20px;border-radius:18px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.icon-btn{min-height:36px;width:36px;padding:0;border-radius:50%;background:transparent;color:var(--muted);font-size:18px}
input,select,textarea{font:inherit;width:100%;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-height:48px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pitch)}
textarea{min-height:70px;resize:vertical}
label.f{display:block;margin-bottom:10px;font-size:14px;font-weight:600;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{margin-top:4px;color:var(--ink);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:8px 14px;border-radius:999px;background:var(--bg);border:2px solid var(--line);color:var(--ink);font-weight:600;font-size:15px}
.chip.on{background:var(--pitch);border-color:var(--pitch);color:#fff}
.chip.guess{background:var(--water-l);border-color:var(--water);color:var(--ink)}
.seg{position:sticky;top:-14px;z-index:15;display:flex;outline:10px solid var(--bg);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:14px;gap:4px;box-shadow:var(--shadow)}
.seg button{flex:1;min-height:40px;padding:6px 4px;background:transparent;color:var(--muted);font-size:14px;border-radius:10px}
.seg button.on{background:var(--pitch);color:#fff}
nav.bottom{flex:none;position:relative;z-index:30;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px rgba(0,0,0,.06)}
nav.bottom .in{display:flex;max-width:640px;width:100%}
nav.bottom button{flex:1;flex-direction:column;gap:2px;background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;min-height:58px;padding:4px 2px;border-radius:12px}
nav.bottom button .i{font-size:23px;line-height:1}
nav.bottom button.on{color:var(--pitch);background:var(--pitch-l)}
@media (prefers-color-scheme:dark){nav.bottom button.on{color:#8fe0a6}}
/* water bottle */
.water-wrap{display:flex;gap:16px;align-items:center}
.bottle-wrap{display:flex;flex-direction:column;align-items:center;flex:none}
.cap{width:46px;height:16px;background:var(--water);border-radius:6px 6px 2px 2px;margin-bottom:-2px}
.neck{width:60px;height:12px;border:4px solid var(--water);border-bottom:none;border-radius:8px 8px 0 0;background:var(--card)}
.bottle{position:relative;width:104px;height:196px;border:4px solid var(--water);border-radius:26px 26px 22px 22px;overflow:hidden;background:var(--card)}
.bottle .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(#63b6ff,#2d8cf0);transition:height 1s cubic-bezier(.2,.8,.2,1)}
.bottle .fill::before{content:"";position:absolute;width:260px;height:260px;left:50%;top:0;border-radius:43%;background:var(--card);
  transform:translate(-50%,-97%) rotate(0deg);animation:wave 7s linear infinite}
.bottle .tick{position:absolute;left:0;width:14px;border-top:2px solid rgba(45,140,240,.35)}
.bottle .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:var(--ink);text-shadow:0 0 6px var(--card)}
@keyframes wave{to{transform:translate(-50%,-97%) rotate(360deg)}}
.water-controls{flex:1;display:flex;flex-direction:column;gap:8px}
.big-num{font-size:30px;font-weight:800;line-height:1.1}
/* fuel check */
.fuel{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.fuel .g{text-align:center;border-radius:16px;padding:10px 4px;background:var(--bg);border:2px dashed var(--line);opacity:.55;transition:.3s}
.fuel .g .e{font-size:30px;filter:grayscale(1)}
.fuel .g.on{opacity:1;border-style:solid;background:var(--pitch-l);border-color:var(--pitch)}
.fuel .g.on .e{filter:none;animation:pop .5s}
.fuel .g .n{font-size:12px;font-weight:700;margin-top:2px}
@keyframes pop{50%{transform:scale(1.3)}}
.meal-dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.meal-dots span{font-size:13px;padding:4px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.meal-dots span.on{background:var(--pitch);color:#fff;border-color:var(--pitch)}
/* lists */
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:none}
.item .em{font-size:26px;width:36px;text-align:center;flex:none}
.item .t{font-weight:700}
.thumb{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none;background:var(--bg)}
.gicons{font-size:15px;letter-spacing:2px}
.preview{width:100%;max-height:260px;object-fit:cover;border-radius:14px;margin:8px 0;display:block}
.diary-day{margin-bottom:14px}
.diary-day h3{margin:0 0 6px;font-size:15px}
.diary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.diary-grid figure{margin:0;position:relative}
.diary-grid img,.diary-grid .noimg{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--pitch-l);display:flex;align-items:center;justify-content:center;font-size:30px}
.diary-grid figcaption{font-size:11.5px;line-height:1.2;margin-top:3px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* sliders */
.slider{margin:10px 0}
.slider .lab{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.slider .face{font-size:30px}
input[type=range]{padding:0;border:none;min-height:36px;accent-color:var(--pitch);background:transparent}
/* banners */
#banners{flex:none;width:100%;max-width:640px;margin:0 auto;padding:0 16px}
#banners:not(:empty){padding-bottom:10px}
.banner{display:flex;gap:10px;align-items:center;background:var(--water);color:#fff;border-radius:16px;padding:12px 12px 12px 14px;margin-top:12px;box-shadow:var(--shadow);animation:slide .35s}
.banner.food{background:var(--orange)}.banner.warn{background:var(--red)}
.banner .b{flex:1}.banner .b strong{display:block}
.banner button{background:rgba(255,255,255,.22);color:#fff;min-height:38px;padding:6px 10px}
@keyframes slide{from{transform:translateY(-10px);opacity:0}}
.alert{border-radius:16px;padding:12px 14px;margin-bottom:14px;font-weight:600}
.alert.warn{background:#fff1f0;color:#a61e22;border:2px solid #ffc9c9}
.alert.info{background:var(--water-l);border:2px solid #a5d0ff}
.alert.good{background:var(--pitch-l);border:2px solid #9fd9ae}
@media (prefers-color-scheme:dark){.alert.warn{background:#3a1416;color:#ffc9c9;border-color:#7a2a2e}.alert.info{border-color:#28507a}.alert.good{border-color:#2c6b3e}}
.sugg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.sugg:last-child{border-bottom:none}.sugg .em{font-size:24px}
/* stats */
.stat{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.stat .v{font-size:24px;font-weight:800}.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.streaks{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.streak{background:var(--bg);border-radius:14px;padding:10px 6px;text-align:center}
.streak .v{font-size:24px;font-weight:800}.streak .l{font-size:11.5px;color:var(--muted);font-weight:600}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{text-align:center;padding:12px 6px;border-radius:16px;background:var(--bg);border:2px solid var(--line)}
.badge .e{font-size:32px}.badge .n{font-size:12px;font-weight:700;margin-top:4px}.badge .d{font-size:11px;color:var(--muted)}
.badge.locked{opacity:.45}.badge.locked .e{filter:grayscale(1)}
.badge.got{border-color:var(--gold);background:linear-gradient(180deg,#fff8db,var(--card))}
@media (prefers-color-scheme:dark){.badge.got{background:linear-gradient(180deg,#3a3210,var(--card))}}
details{border-top:1px solid var(--line);padding:6px 0}
details:first-of-type{border-top:none}
summary{cursor:pointer;font-weight:700;padding:8px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--muted)}
details[open] summary::after{content:"－"}
.food-list{margin:0;padding:0;list-style:none}
.food-list li{padding:8px 0;border-bottom:1px dashed var(--line)}
.food-list li:last-child{border:none}
.food-list b{display:block}
.timeline{border-left:3px solid var(--pitch);margin:6px 0 6px 10px;padding-left:16px}
.timeline .step{position:relative;margin-bottom:14px}
.timeline .step::before{content:"";position:absolute;left:-24px;top:4px;width:13px;height:13px;border-radius:50%;background:var(--pitch);border:3px solid var(--card)}
.timeline .when{font-weight:800;color:var(--pitch)}
@media (prefers-color-scheme:dark){.timeline .when{color:#8fe0a6}}
.test-card .pb{font-size:13px;font-weight:700;color:var(--gold)}
.dayrow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.dayrow:last-child{border:none}
.dayrow .dn{width:46px;font-weight:800;flex:none}
.dayrow.train .dn{color:var(--pitch)}
.chartbox{position:relative;height:220px}
.daytype .chip{flex:1;justify-content:center}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.weekdays .chip{padding:8px 0;justify-content:center;min-height:42px}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto;animation:up .25s}
@media (min-width:700px){.modal{align-items:center}.modal .sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.clock{font-size:56px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14231a;color:#fff;padding:12px 18px;border-radius:14px;z-index:60;font-weight:600;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:slide .3s}
body.auth nav.bottom,body.auth #banners{display:none}
body.auth main{padding-bottom:32px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.hidden{display:none!important}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--pitch-l);color:var(--pitch-d)}
@media (prefers-color-scheme:dark){.tag{color:#8fe0a6}}
.tip{font-size:15px}
.chk{width:38px;height:38px;min-height:38px;padding:0;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:#fff;font-size:20px;flex:none}
input[type=checkbox]{width:24px;height:24px;min-height:0;padding:0;margin:0;accent-color:var(--pitch);flex:none}
.why{border:none;padding:0 0 4px}
.glass-ico{width:34px;height:34px;border-radius:8px;object-fit:cover;border:2px solid rgba(255,255,255,.7)}
.drinks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:6px}
.drink{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:6px}
.drink img,.drink .noimg{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;background:var(--water-l)}
.drink .small{flex:1;line-height:1.25}
.sched{border:2px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.stations{margin:6px 0 10px;padding-left:20px}
.stations li{padding:2px 0}.stations details{border:none;padding:0}.stations summary{padding:0;font-weight:600;color:var(--muted)}
.ctimer{border-radius:18px;padding:18px 14px;text-align:center;color:#fff;background:var(--orange);transition:background .3s}
.ctimer.work{background:var(--pitch)}.ctimer.rest{background:var(--water)}
.ctimer .ctname{font-size:28px;font-weight:800;margin-top:6px;line-height:1.15}
.ctimer .clock{font-size:72px;margin:6px 0;color:#fff}
.ctbar{height:8px;border-radius:8px;background:rgba(255,255,255,.3);margin-top:12px;overflow:hidden}
.ctbar div{height:100%;width:0;background:#fff;transition:width .2s}
.chk.on{background:var(--pitch);border-color:var(--pitch)}
.item.done .t{text-decoration:line-through;opacity:.6}
.item details{border:none;padding:0}.item summary{padding:2px 0;font-weight:600;color:var(--muted)}
hr{border:none;border-top:1px solid var(--line);margin:14px 0}
</style>
</head>
<body>
<header class="top"><div class="row"><span style="font-size:24px">⚽</span><h1 id="hdrTitle">Footy Tracker</h1><span class="date" id="hdrDate"></span><span id="syncDot" style="font-size:15px"></span></div></header>
<div id="banners"></div>
<main id="view"></main>
<nav class="bottom"><div class="in" id="nav"></div></nav>
<input type="file" id="photoInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="waterPhotoInput" accept="image/*" capture="environment" class="hidden">
<input type="file" id="importInput" accept="application/json,.json" class="hidden">
<canvas id="confetti"></canvas>

<script>
'use strict';
/* =========================================================
   Footy Tracker — everything stays on this device.
   localStorage holds the data, IndexedDB holds food photos.
   ========================================================= */

const TFJS_URL = 'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js';
const MOBILENET_URL = 'https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.1/dist/mobilenet.min.js';
let KEY = 'footyTracker.v1', DB_NAME = 'footyTracker', ACCOUNT = null; // set per account at login
const GLASS = 250; // a standard glass, used for goal maths

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const dkey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => dkey();
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };
const daysBetween = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const hm2min = s => { const [h, m] = String(s || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function fmtTime(min) {
  min = ((Math.round(min) % 1440) + 1440) % 1440;
  let h = Math.floor(min / 60); const m = min % 60; const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
  return m ? `${h}:${pad(m)}${ap}` : `${h}${ap}`;
}
const fmtDate = (k, opts = { weekday: 'short', day: 'numeric', month: 'short' }) => parseKey(k).toLocaleDateString('en-GB', opts);
const fmtL = ml => (ml / 1000).toFixed(ml % 1000 === 0 ? 0 : (ml % 100 === 0 ? 1 : 2)) + ' L';
const glassMl = () => clamp(+S.settings.glassMl || GLASS, 50, 2000);
const glasses = ml => { const g = ml / glassMl(); return Number.isInteger(g) ? g : g.toFixed(1); };
const WEEKDAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

/* ---------- state ---------- */
const DEFAULT = {
  version: 1,
  profile: { name: '', age: 13, position: '', team: '', trainingDays: [2, 4, 6], trainingTime: '17:00', trainingDuration: 90 },
  growth: [],        // {id,date,height,weight}
  days: {},          // 'YYYY-MM-DD' -> {water, goal, meals:[], sleep, checkin, type, fired:[]}
  sessions: [],      // {id,date,type,duration,intensity,matchId?}
  matches: [],       // {id,date,minutes,position,goals,assists,rating,notes}
  tests: [],         // {id,date,test,value}
  badges: {},        // id -> date earned
  settings: { reminders: true, quietStart: '22:00', quietEnd: '07:00', interval: 120, foodMap: {}, glassMl: 250, glassPhotoId: null },
  workout: { mode: null, own: [], ownDays: [], ownMinutes: 30, answers: {} }, // mode: 'own' | 'suggest'
  workoutLog: [],    // {id,date,title,minutes,effort,notes,items:[{name,amount,done}]}
};
function merge(a, b) {
  for (const k in b) {
    const av = a[k], bv = b[k];
    if (bv && typeof bv === 'object' && !Array.isArray(bv) && av && typeof av === 'object' && !Array.isArray(av)) merge(av, bv);
    else a[k] = bv;
  }
  return a;
}
// Older data had one training schedule; it becomes the first entry in the list.
function fixState(st) {
  const P = st.profile;

/* ---------- training schedules (club, school, academy…) & day type ---------- */
const schedules = () => S.profile.schedules || [];
const trainingWeekdays = () => [...new Set(schedules().flatMap(x => x.days))];
// Planned sessions on a weekday, earliest first.
function plannedOn(dow) {
  return schedules().filter(x => x.days.includes(dow)).map(x => {
    const start = hm2min(x.time || '17:00');
    return { id: x.id, name: x.name || 'Training', start, end: start + (+x.duration || 90), duration: +x.duration || 90 };
  }).sort((a, b) => a.start - b.start);
}
function dayType(k) {
  const d = getDay(k);
  if (d && d.type) return d.type;
  if (S.matches.some(m => m.date === k)) return 'match';
  return plannedOn(parseKey(k).getDay()).length ? 'training' : 'rest';
}
// The sessions reminders and tips plan around today. A day switched to Training or Match with nothing
// scheduled borrows the first schedule's time.
function sessionsOn(k) {
  const t = dayType(k); if (t === 'rest') return [];
  const list = plannedOn(parseKey(k).getDay());
  if (list.length) return list;
  const f = schedules()[0], start = hm2min(f?.time || '17:00'), duration = +f?.duration || 90;
  return [{ id: 'extra', name: t === 'match' ? 'Match' : 'Training', start, end: start + duration, duration }];
}
const hasMealSince = (k, m, min) => !!getDay(k)?.meals?.some(x => x.meal === m && hm2min(x.time) >= min);
function latestWeight() {
  const g = [...S.growth].sort((a, b) => a.date.localeCompare(b.date)).filter(x => x.weight);
  return g.length ? +g[g.length - 1].weight : null;
}
function baseGoal() {
  const w = latestWeight();
  if (!w) return 8 * GLASS;
  return clamp(Math.round(w * 37.5 / GLASS) * GLASS, 1500, 3250); // ~35–40 ml per kg
}
function waterGoal(k = today()) {
  const d = getDay(k);
  if (k !== today() && d && d.goal) return d.goal;
  const t = dayType(k);
  return baseGoal() + (t === 'match' ? 750 : t === 'training' ? 500 : 0);
}

function suggestMeal() {
  const n = nowMin(), k = today();
  for (const x of sessionsOn(k)) {
    if (n >= x.start - 150 && n < x.start && !hasMealSince(k, 'pre', x.start - 180)) return 'pre';
    if (n >= x.end - 15 && n <= x.end + 90 && !hasMealSince(k, 'post', x.end - 15)) return 'post';
  }
  if (n < 630 && !hasMeal(k, 'breakfast')) return 'breakfast';
  if (n >= 690 && n < 900 && !hasMeal(k, 'lunch')) return 'lunch';
  if (n >= 1110 && !hasMeal(k, 'dinner')) return 'dinner';
  if (n < 630) return 'breakfast';
  return 'other';
}

function inQuiet(min) {

}
function reminderPlan(k = today()) {
  const list = [], sess = sessionsOn(k);
  sess.forEach((x, i) => {
    const gap = i ? x.start - sess[i - 1].end : Infinity; // back-to-back sessions share one build-up
    if (gap > 120) list.push({ at: x.start - 120, id: 'pre-snack-' + x.id, kind: 'food', title: `${x.name} at ${fmtTime(x.start)} — fuel up`, body: 'Have a pre-training snack: banana, peanut butter toast or a small bowl of poha.', cond: () => !hasMealSince(k, 'pre', x.start - 180) });
    if (gap >= 45) list.push({ at: Math.max(x.start - 90, x.start - gap + 30), id: 'pre-water-' + x.id, title: `${x.name} soon 💧`, body: 'Drink 1–2 glasses now.' });
    for (let m = x.start + 20; m < x.end - 5; m += 20) list.push({ at: m, id: 'during-' + x.id + '-' + m, title: 'Sip time 💧', body: 'Sip water every 15–20 minutes while you play.' });
    const nx = sess[i + 1], soon = nx && nx.start - x.end <= 150;
    list.push({ at: x.end + 10, id: 'post-' + x.id, kind: soon ? 'food' : undefined, title: `${x.name} done! 💪`,
      body: soon ? `Drink 2 glasses and have a snack to refuel for ${nx.name} at ${fmtTime(nx.start)} — banana, milk, a sandwich or a few dates.` : 'Drink 2 glasses and have a recovery snack — milk, lassi, eggs or a paneer sandwich.' });
  });
  const wake = hm2min(S.settings.quietEnd); let sleep = hm2min(S.settings.quietStart); if (sleep <= wake) sleep += 1440;
  const iv = clamp(+S.settings.interval || 120, 60, 240);
  for (let m = wake + 60; m <= Math.min(sleep - 30, 1439); m += iv) {
    if (sess.some(x => m >= x.start - 135 && m <= x.end + 45)) continue;
    const at = m;
    list.push({ at, id: 'reg-' + at, title: 'Water break 💧', body: 'Time for a glass of water.',
      cond: () => { // skip if already ahead of pace
        const span = Math.min(sleep, 1439) - wake, exp = waterGoal(k) * clamp((at - wake) / span, 0, 1);
        return (getDay(k)?.water || 0) < exp + GLASS;

  }
  return list.filter(r => r.at >= 0 && r.at < 1440 && !inQuiet(r.at)).sort((a, b) => a.at - b.at);
}
function nextReminder() {
  if (!S.settings.reminders) return null;
  const k = today(), n = nowMin(), fired = firedIds(k);
  return reminderPlan(k).find(r => r.at > n && !fired.includes(r.id) && (!r.cond || r.cond())) || null;
}
let swReg = null;
async function notify(r) {

  const opts = { body: r.body, tag: 'footy-' + r.id, icon: ICONS[192], badge: ICONS[192] };

  } catch (e) { }
}
const banners = [];
function showBanner(r) {
  if (banners.some(b => b.id === r.id)) return;
  banners.unshift(r); if (banners.length > 3) banners.pop();
  renderBanners();
}
function renderBanners() {
  $('#banners').innerHTML = banners.map(b => `<div class="banner ${b.kind || ''}">
    <span style="font-size:26px">${b.kind === 'food' ? '🍌' : b.kind === 'warn' ? '⚠️' : '💧'}</span>
    <div class="b"><strong>${esc(b.title)}</strong>${esc(b.body)}</div>
    ${b.kind === 'food' ? `<button data-act="bannerFood" data-id="${b.id}">Log</button>` : b.kind === 'warn' ? '' : `<button data-act="bannerWater" data-id="${b.id}">+1</button>`}
    <button class="icon-btn" style="color:#fff" data-act="dismissBanner" data-id="${b.id}" aria-label="Dismiss">✕</button></div>`).join('');

// Which reminders this phone has already shown today. Kept per phone, not synced.
function firedIds(k) { try { const f = JSON.parse(localStorage.getItem(KEY + '.fired')); return f && f.date === k ? f.ids : []; } catch (e) { return []; } }
function tickReminders() {
  if (!S.settings.reminders) return;
  const k = today(), n = nowMin(), due = [];
  const fired = firedIds(k), before = fired.length;
  for (const r of reminderPlan(k)) {
    if (r.at > n) break;
    if (fired.includes(r.id)) continue;
    fired.push(r.id);

  if (fired.length !== before) try { localStorage.setItem(KEY + '.fired', JSON.stringify({ date: k, ids: fired })); } catch (e) { }

}

async function guessFood(canvas) {
  const p = UI.pending; p.status = 'Loading food recogniser… (first time ~15 MB, then it\'s saved)'; refreshFoodPhoto();
  try {
    const model = await getModel();
    p.status = 'Looking at your food…'; refreshFoodPhoto();
    // ImageNet knows ~1000 things, few of them Indian dishes: keep only food and dish guesses.
    const preds = await model.classify(canvas, 25);
    const out = [];
    for (const pr of preds) {
      const raw = pr.className.split(',')[0].trim().toLowerCase();
      if (!(raw in FRIENDLY) || pr.probability < 0.005) continue;
      const name = FRIENDLY[raw];
      if (!out.includes(name)) out.push(name);
      if (out.length === 3) break;
    }
    if (UI.pending !== p) return;
    p.guesses = out;
    p.status = out.length ? 'Guesses ready — pick one or type the real name.' : 'Not sure what this is — tap a quick pick or type it.';
  } catch (e) {
    p.status = 'Could not load the recogniser (offline?). Just type what you ate.';
  }
  if (UI.pending === p && UI.tab === 'food') renderFood($('#view'));
}
function refreshFoodPhoto() { if (UI.tab === 'food' && UI.food === 'log') { keepFoodName(); renderFood($('#view')); } }
function keepFoodName() { const el = $('#foodName'); if (el && UI.pending) UI.pending.name = el.value; }
function loadImg(file) {
  return new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = rej; i.src = u; });
}
async function compress(file, max = 600) {
  const img = await loadImg(file);
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', 0.75));
  return { canvas: c, blob };
}

      if (old) Object.assign(old, log); else S.workoutLog.push(log);

/* timers */
function openStopwatch(testId) {
  let start = 0, acc = 0, raf = 0, running = false;
  modal(`<h2>⏱️ Stopwatch${testId ? ' — ' + esc(testById(testId).n) : ''}</h2><div class="clock" id="swClock">0.00</div>
    <div class="grid2"><button class="btn primary big" id="swGo">Start</button><button class="btn ghost big" id="swReset">Reset</button></div>
    ${testId ? '<button class="btn block" style="margin-top:10px" id="swUse">Use this time</button>' : ''}
    <button class="btn ghost block" style="margin-top:10px" data-act="closeModal">Close</button>`, m => {
    const el = $('#swClock', m), go = $('#swGo', m);
    const cur = () => acc + (running ? performance.now() - start : 0);
    const fmt = ms => { const s = ms / 1000; return s >= 60 ? `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}.${pad(Math.floor(ms / 10) % 100)}` : s.toFixed(2); };
    const loop = () => { el.textContent = fmt(cur()); if (running) raf = requestAnimationFrame(loop); };
    go.onclick = () => { if (running) { acc = cur(); running = false; go.textContent = 'Start'; loop(); } else { start = performance.now(); running = true; go.textContent = 'Stop'; loop(); } };
    $('#swReset', m).onclick = () => { running = false; acc = 0; go.textContent = 'Start'; loop(); };
    if (testId) $('#swUse', m).onclick = () => {
      const t = testById(testId), v = cur() / 1000; const inp = $('#tv-' + testId);
      if (inp) inp.value = t.step >= 1 ? Math.round(v) : v.toFixed(2);
      closeModal(); inp?.scrollIntoView({ block: 'center' });
    };
    m._cleanup = () => cancelAnimationFrame(raf);
  });
}
function openCountdown(sec = 60) {
  let left = sec * 1000, end = 0, iv = 0, running = false;
  modal(`<h2>⏳ Countdown</h2><div class="chips" style="justify-content:center">${[30, 60, 120, 300].map(s => `<button class="chip" data-s="${s}">${s < 60 ? s + 's' : s / 60 + ' min'}</button>`).join('')}</div>
    <div class="clock" id="cdClock"></div>
    <div class="grid2"><button class="btn primary big" id="cdGo">Start</button><button class="btn ghost big" id="cdReset">Reset</button></div>
    <button class="btn ghost block" style="margin-top:10px" data-act="closeModal">Close</button>`, m => {
    const el = $('#cdClock', m), go = $('#cdGo', m);
    const show = ms => { const s = Math.ceil(ms / 1000); el.textContent = `${Math.floor(s / 60)}:${pad(s % 60)}`; };
    const stop = () => { clearInterval(iv); running = false; go.textContent = 'Start'; };
    const set = s => { stop(); sec = s; left = s * 1000; show(left); };
    $$('[data-s]', m).forEach(b => b.onclick = () => set(+b.dataset.s));
    go.onclick = () => {
      if (running) { left = end - performance.now(); stop(); return; }
      if (left <= 0) left = sec * 1000;
      try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) { }
      end = performance.now() + left; running = true; go.textContent = 'Pause';
      iv = setInterval(() => { const l = end - performance.now(); if (l <= 0) { stop(); left = 0; show(0); el.textContent = 'Time! 🎉'; beep(3); } else show(l); }, 100);
    };
    $('#cdReset', m).onclick = () => set(sec);
    show(left);
    m._cleanup = () => clearInterval(iv);
  });
}

function addWater(ml, photoId = null) {
  const k = today(), d = day(k), goal = waterGoal(k), before = d.water;
  d.water = Math.max(0, d.water + ml); d.goal = goal;
  if (ml > 0) (d.drinks = d.drinks || []).push({ id: uid(), time: `${pad(new Date().getHours())}:${pad(new Date().getMinutes())}`, ml, photoId });
  save();
  if (before < goal && d.water >= goal) setTimeout(() => celebrate('💧 Water goal smashed! Great job!'), 300);
  else if (ml > 0 && navigator.vibrate) navigator.vibrate(30);
  checkBadges(); render();
}

  x.strokeStyle = 'rgba(255,255,255,.55)'; x.lineWidth = size * .02; x.beginPath(); x.arc(size / 2, size / 2, size * .3, 0, Math.PI * 2); x.stroke();

  return c.toDataURL('image/png');
}

const SB_URL = 'https://cxymzxgypjrqezslsgqn.supabase.co', SB_KEY = 'sb_publishable_Y0BpgYpkr3tzwYApKdKb4A_KvGD4ymO';

  return j;

const toSession = (j, username, keep) => ({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), uid: j.user.id, username, keep });

async function pushCloud() {

// Both phones changed things since they last synced: keep everything from both.
// Lists are joined by id, a day's meals and drinks are joined, settings follow this phone.
function mergeStates(local, remote) {
  const out = merge(structuredClone(DEFAULT), remote);
  const byId = (mine = [], theirs = []) => { const m = new Map(); [...theirs, ...mine].forEach(x => m.set(x.id, x)); return [...m.values()]; };
  for (const k of ['growth', 'sessions', 'matches', 'tests', 'workoutLog']) out[k] = byId(local[k], remote[k]);
  for (const [k, ld] of Object.entries(local.days || {})) {
    const rd = out.days[k];
    if (!rd) { out.days[k] = ld; continue; }
    const drinks = byId(ld.drinks, rd.drinks);
    out.days[k] = { ...rd, ...ld, meals: byId(ld.meals, rd.meals), drinks,
      water: Math.max(ld.water || 0, rd.water || 0, drinks.reduce((a, x) => a + (x.ml || 0), 0)) };
  }
  out.profile = local.profile; out.settings = local.settings; out.workout = local.workout;
  out.badges = { ...(remote.badges || {}), ...(local.badges || {}) };
  return out;
}
// Fetch the account's data before uploading anything. If another phone saved since this one last synced,
// take its copy (or merge, when this phone has changes of its own too).
let syncing = null;
function syncDown() { return syncing || (syncing = doSyncDown().finally(() => { syncing = null; })); }
async function doSyncDown() {
  if (!SESSION) return;
  try {
    const row = (await sbRest('tracker_state?select=state'))?.[0];
    pulled = true;
    if (!row) { S.savedAt = S.savedAt || new Date().toISOString(); dirty = true; saveVer++; return pushCloud(); } // brand-new account: upload what this phone has
    const remoteAt = row.state?.savedAt || '';
    if (remoteAt > getBase()) {
      if (dirty) { S = fixState(mergeStates(S, fixState(merge(structuredClone(DEFAULT), row.state)))); S.savedAt = new Date().toISOString(); saveVer++; }
      else S = fixState(merge(structuredClone(DEFAULT), row.state));
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
      setBase(remoteAt);
      if (!document.activeElement?.matches('input,select,textarea') && !$('#modal')) render();
    }
    if (dirty) return pushCloud();
    setSync('saved');
  } catch (e) { setSync('offline'); }
}
function sessionExpired() {

// Where this account's data lives on this phone. The first login here adopts data saved before cloud accounts.
function localFor(uid, username) {
  const map = readJSON(localStorage, LOCAL_MAP, {});
  if (map[uid]) return map[uid];
  const old = readJSON(localStorage, OLD_ACCTS, { users: {} }).users || {};
  const taken = new Set(Object.values(map).map(m => m.key));
  let m;
  if (old[username] && !taken.has(old[username].key)) m = { key: old[username].key, db: old[username].db };
  else if (localStorage.getItem('footyTracker.v1') && !taken.has('footyTracker.v1') && !Object.entries(old).some(([u, x]) => x.key === 'footyTracker.v1' && u !== username)) m = { key: 'footyTracker.v1', db: 'footyTracker' };
  else m = { key: 'footyTracker.v1.c.' + uid, db: 'footyTracker.c.' + uid };
  map[uid] = { ...m, username };
  if (!m.key.startsWith('footyTracker.v1.c.')) try { localStorage.setItem(m.key + '.dirty', '1'); } catch (e) { }
  try { localStorage.setItem(LOCAL_MAP, JSON.stringify(map)); } catch (e) { }
  return map[uid];
}
const usersHere = () => Object.values(readJSON(localStorage, LOCAL_MAP, {})).map(m => m.username).filter(Boolean);

function renderAuth(mode = 'login', msg = '') {
  document.body.classList.add('auth');
  const users = usersHere();
  const hasOld = !!localStorage.getItem('footyTracker.v1') || Object.keys(readJSON(localStorage, OLD_ACCTS, { users: {} }).users || {}).length > 0;
  $('#hdrTitle').textContent = 'Footy Tracker'; $('#hdrDate').textContent = ''; setSync('');
  $('#view').innerHTML = `
  <div class="center" style="margin:18px 0 14px"><div style="font-size:64px">⚽</div><h2 style="font-size:24px;margin:4px 0">Footy Tracker</h2><p class="muted">Water, food, sleep, training and workouts.</p></div>
  <div class="seg">${[['login', 'Log in'], ['create', 'Create account']].map(([id, n]) => `<button class="${mode === id ? 'on' : ''}" data-act="authMode" data-val="${id}">${n}</button>`).join('')}</div>
  <div class="card">
    ${msg ? `<div class="alert warn small">${esc(msg)}</div>` : ''}
    ${mode === 'login' && users.length ? `<p class="small muted" style="margin:0 0 6px">Used on this phone:</p><div class="chips" style="margin-bottom:12px">${users.map(u => `<button class="chip" data-act="pickUser" data-val="${esc(u)}">👤 ${esc(u)}</button>`).join('')}</div>` : ''}
    ${mode === 'create' && hasOld && !users.length ? '<div class="alert info small">What\'s already saved on this phone will move into your new account.</div>' : ''}
    <form id="authForm" autocomplete="on">
      <label class="f">Username<input id="aUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required minlength="3" maxlength="20" placeholder="e.g. arjun10"></label>
      <label class="f">Password<input id="aPass" name="password" type="password" autocomplete="${mode === 'create' ? 'new-password' : 'current-password'}" required minlength="6"></label>
      ${mode === 'create' ? '<label class="f">Password again<input id="aPass2" type="password" autocomplete="new-password" required minlength="6"></label><p class="small muted" style="margin-top:-4px">At least 6 characters. Write it down somewhere safe.</p>' : ''}
      <label class="row small" style="margin:6px 0 14px"><input type="checkbox" id="aKeep" checked> Keep me logged in</label>
      <button class="btn primary block big" type="submit" id="aGo">${mode === 'create' ? 'Create account' : 'Log in'}</button>
    </form>
    ${mode === 'login' ? '<button class="btn ghost block" style="margin-top:10px" data-act="forgotPw">Forgot password?</button>' : ''}
  </div>
  <p class="small muted center">Log in with the same username and password on any phone or laptop to see the same data. Photos stay on the phone they were taken on.</p>`;
  $('#authForm').onsubmit = e => { e.preventDefault(); submitAuth(mode); };
}
function renderAuthMsg(mode, msg, user) { renderAuth(mode, msg); $('#aUser').value = user || ''; $('#aPass').focus(); }
async function submitAuth(mode) {
  const u = normUser($('#aUser').value), pw = $('#aPass').value, keep = $('#aKeep').checked;
  if (!/^[a-z0-9_.-]{3,20}$/.test(u)) return renderAuthMsg(mode, 'Username: 3–20 letters, numbers, dots, dashes or underscores (no spaces).', u);
  if (pw.length < 6) return renderAuthMsg(mode, 'Password needs at least 6 characters.', u);
  if (mode === 'create' && pw !== $('#aPass2').value) return renderAuthMsg(mode, 'The two passwords don\'t match.', u);
  const go = $('#aGo'); go.disabled = true; go.textContent = mode === 'create' ? 'Creating…' : 'Logging in…';
  try {
    const j = mode === 'create' ? await sbAuth('signup', { email: emailFor(u), password: pw, data: { username: u } })
      : await sbAuth('token?grant_type=password', { email: emailFor(u), password: pw });
    if (!j.access_token) throw Object.assign(new Error('no session'), { code: 'no_session' });
    writeSession(toSession(j, u, keep));
    startApp(mode === 'create');
  } catch (e) {
    const m = !navigator.onLine || e instanceof TypeError ? 'No internet connection. You need to be online to log in on a phone for the first time.'
      : e.code === 'user_already_exists' || /already registered/i.test(e.message) ? 'That username is taken. Try another one, or log in.'
      : e.code === 'invalid_credentials' || e.status === 400 ? 'Wrong username or password.'
      : e.code === 'weak_password' ? 'That password is too easy to guess. Try a longer one.'
      : e.status === 429 ? 'Too many tries. Wait a minute and try again.'
      : 'Something went wrong (' + e.message + '). Try again.';
    renderAuthMsg(mode, m, u);
  }
}
async function logOut() {
  if (dirty && navigator.onLine) await pushCloud();
  try { if (SESSION) await sbAuth('logout', null, 'POST', SESSION.access_token); } catch (e) { }
  clearSession(); location.reload();
}
let started = false;
function startApp(isNew) {
  const m = localFor(SESSION.uid, SESSION.username);
  ACCOUNT = SESSION.username; KEY = m.key; DB_NAME = m.db; idb._db = null;
  document.body.classList.remove('auth');
  S = load();
  dirty = !!localStorage.getItem(KEY + '.dirty');
  // Workouts finished before the log existed become log entries.
  S.sessions.filter(x => x.workout && !x.logId).forEach(x => { x.logId = uid(); S.workoutLog.push({ id: x.logId, date: x.date, title: 'Workout', minutes: x.duration, effort: x.intensity || 'medium', notes: '', items: [] }); });
  if (!S.profile.name) S.profile.name = ACCOUNT.charAt(0).toUpperCase() + ACCOUNT.slice(1);
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { }
  try { Object.assign(UI, JSON.parse(localStorage.getItem(KEY + '.ui')) || {}); UI.pending = null; } catch (e) { }
  if (isNew) { UI.tab = 'today'; toast(`Welcome, ${S.profile.name}! ⚽`); }
  render(); checkBadges(); tick();
  syncDown();
  if (started) return; started = true;
  setInterval(() => { tick(); if (dirty) (pulled ? pushCloud() : syncDown()); }, 30000);
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') { tick(); syncDown(); }
    else { if (dirty) pushCloud(); pulled = false; } // after time away, download again before the next upload
  });
  addEventListener('online', () => syncDown());
}
Object.assign(ACT, {
  authMode(el) { renderAuth(el.dataset.val); },
  pickUser(el) { $('#aUser').value = el.dataset.val; $('#aPass').focus(); },
  forgotPw() {
    modal(`<h2>Forgot password?</h2><p>There's no email, so the app can't reset it by itself.</p>
      <p>Ask the parent who set the app up: they can set a new password in Supabase (the online database the app uses). Your data is safe in the meantime.</p>
      <button class="btn primary block" data-act="closeModal">OK</button>`);
  },
  logOut() { logOut(); },
  changePw() {
    modal(`<h2>Change password</h2>
      <label class="f">Current password<input type="password" id="cp0" autocomplete="current-password"></label>
      <label class="f">New password<input type="password" id="cp1" autocomplete="new-password" minlength="6"></label>
      <label class="f">New password again<input type="password" id="cp2" autocomplete="new-password"></label>
      <div class="grid2"><button class="btn ghost" data-act="closeModal">Cancel</button><button class="btn primary" id="cpGo">Save</button></div>`, m => {
      $('#cpGo', m).onclick = async () => {
        const p1 = $('#cp1', m).value;
        if (p1.length < 6) { toast('At least 6 characters'); return; }
        if (p1 !== $('#cp2', m).value) { toast('New passwords don\'t match'); return; }
        try {
          const j = await sbAuth('token?grant_type=password', { email: emailFor(ACCOUNT), password: $('#cp0', m).value });
          writeSession(toSession(j, ACCOUNT, SESSION.keep));
          await sbAuth('user', { password: p1 }, 'PUT', SESSION.access_token);
          closeModal(); toast('🔑 Password changed — use it on every phone');
        } catch (e) { toast(e.status === 400 && !e.code?.includes('weak') ? 'Current password is wrong' : 'Could not change it (' + e.message + ')'); }
      };
    });
  },
  deleteMe() {
    confirmBox('Delete your data?', 'This erases everything in your account — on every phone — plus the photos on this phone.', 'Continue', () => {
      confirmBox('Are you really sure?', 'There is no undo. Export a backup first if you might want it back.', 'Yes, delete it all', async () => {
        try { await sbRest('tracker_state?user_id=eq.' + SESSION.uid, { method: 'DELETE' }); }
        catch (e) { toast('Need internet to delete your account data'); return; }
        localStorage.removeItem(KEY); localStorage.removeItem(KEY + '.ui'); localStorage.removeItem(KEY + '.dirty');
        try { indexedDB.deleteDatabase(DB_NAME); } catch (e) { }
        const map = readJSON(localStorage, LOCAL_MAP, {}); delete map[SESSION.uid]; localStorage.setItem(LOCAL_MAP, JSON.stringify(map));
        dirty = false; await logOut();
      });
    });
  },
});

setupPWA();
SESSION = readSession();
if (SESSION?.uid) startApp(); else renderAuth();
</script>
